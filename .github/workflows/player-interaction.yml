name: amp cover interaction verification
run-name: Player verification — ${{ inputs.scope || 'full-player' }} (${{ inputs.runner || 'macos-15-intel' }})
'on':
  workflow_dispatch:
    inputs:
      scope:
        description: Full player gestures or animation regressions only
        type: choice
        default: full-player
        options:
        - full-player
        - animation-only
      runner:
        description: macOS runner for simulator verification
        type: choice
        default: macos-15-intel
        options:
        - macos-15-intel
        - macos-15
  workflow_call:
    inputs:
      scope:
        type: string
        default: full-player
      runner:
        type: string
        default: macos-15-intel
permissions:
  contents: read
concurrency:
  group: amp-cover-verification-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner || 'macos-15-intel' }}-${{ inputs.scope || 'full-player' }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.event.deleted != true
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-ios
      id: setup
      with:
        cache-suffix: simulator-debug
    - name: Parse native gesture and rendering test sources
      run: |
        xcrun swiftc -frontend -parse ErhuInteractionTests/LibraryInteractionTests.swift
        xcrun swiftc -frontend -parse ErhuTests/Playback/PlayerRenderingTests.swift
    - name: Create the interaction simulator
      run: |
        newest_ios_runtime() {
          xcrun simctl list runtimes available -j | jq -r '
            [.runtimes[] | select(.platform == "iOS")]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty'
        }
        RUNTIME=$(newest_ios_runtime)
        if [ -z "$RUNTIME" ]; then
          echo "No iOS simulator runtime installed for this Xcode; downloading one."
          xcodebuild -downloadPlatform iOS
          RUNTIME=$(newest_ios_runtime)
        fi
        DEVICE_TYPE=$(xcrun simctl list runtimes available -j | jq -r --arg runtime "$RUNTIME" '
          .runtimes[] | select(.identifier == $runtime)
          | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')
        echo "Creating $DEVICE_TYPE on $RUNTIME"
        DEVICE=$(xcrun simctl create "CI UI iPhone" "$DEVICE_TYPE" "$RUNTIME")
        echo "UI_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
        echo "SIMULATOR_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
        echo "SIMULATOR_DEVICE_TYPE=$DEVICE_TYPE" >> "$GITHUB_ENV"
        defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
    - name: Compile app and both test bundles once
      id: simulator-build
      run: |
        if ! xcodebuild build-for-testing -project Erhu.xcodeproj -scheme Erhu -configuration Debug \
          -destination "id=$UI_SIMULATOR_ID" -derivedDataPath build/DerivedData \
          -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO \
          > build/simulator-build.log 2>&1; then
          python3 Tools/report_native_interactions.py build/simulator-build.log
          tail -n 80 build/simulator-build.log
          exit 1
        fi
    - name: Start a fresh simulator immediately before UI testing
      if: ${{ inputs.scope != 'animation-only' }}
      run: |
        # A long compile can leave a previously booted simulator's AX service stale.
        xcrun simctl shutdown "$UI_SIMULATOR_ID" >/dev/null 2>&1 || true
        xcrun simctl boot "$UI_SIMULATOR_ID"
        open -a Simulator --args -CurrentDeviceUDID "$UI_SIMULATOR_ID"
        xcrun simctl bootstatus "$UI_SIMULATOR_ID" -b > build/ui-boot.log 2>&1
    - name: Run real cover swipe and dismissal checks
      if: ${{ inputs.scope != 'animation-only' }}
      run: |
        run_interactions() {
          xcodebuild test-without-building -project Erhu.xcodeproj -scheme Erhu -configuration Debug \
          -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
          -destination "id=$UI_SIMULATOR_ID" -resultBundlePath build/InteractionResults.xcresult \
          CODE_SIGNING_ALLOWED=NO -only-testing:ErhuInteractionTests/LibraryInteractionTests/testCoverSwipesChangeTracksAndVerticalPullClosesPlayer \
          -only-testing:ErhuInteractionTests/LibraryInteractionTests/testLargeTransportChangesTracksAndSmallTransportSeeksWithinTheTrack \
          -only-testing:ErhuInteractionTests/LibraryInteractionTests/testWaveformDragSeeksInBothDirectionsAndNewTrackStartsFresh \
          -parallel-testing-enabled NO > build/ui-tests.log 2>&1
        }
        if ! run_interactions; then
          # Retry only the documented AX initialization timeout before any test
          # case started. Assertion failures and all other failures stay failures.
          if grep -q 'Timed out waiting for AX loaded notification' build/ui-tests.log \
            && ! grep -q 'Test Case .* started' build/ui-tests.log; then
            mv build/ui-tests.log build/ui-tests-attempt-1.log
            mv build/InteractionResults.xcresult build/InteractionResults-attempt-1.xcresult
            xcrun simctl shutdown "$UI_SIMULATOR_ID" >/dev/null 2>&1 || true
            UI_SIMULATOR_ID=$(xcrun simctl create "CI UI recovery" "$SIMULATOR_DEVICE_TYPE" "$SIMULATOR_RUNTIME")
            echo "UI_SIMULATOR_ID=$UI_SIMULATOR_ID" >> "$GITHUB_ENV"
            xcrun simctl boot "$UI_SIMULATOR_ID"
            open -a Simulator --args -CurrentDeviceUDID "$UI_SIMULATOR_ID"
            xcrun simctl bootstatus "$UI_SIMULATOR_ID" -b > build/ui-boot-retry.log 2>&1
            if ! run_interactions; then
              python3 Tools/report_native_interactions.py build/ui-tests.log
              exit 1
            fi
          else
            python3 Tools/report_native_interactions.py build/ui-tests.log
            exit 1
          fi
        fi
    - name: Report native interaction status
      if: ${{ always() && inputs.scope != 'animation-only' }}
      run: python3 Tools/report_native_interactions.py build/ui-tests.log
    - name: Save compiled products and module caches
      if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' && steps.setup.outputs.build-cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          build/DerivedData/Build
          build/DerivedData/ModuleCache.noindex
          build/DerivedData/SDKStatCaches.noindex
          build/source-file-stamps.json
        key: ${{ steps.setup.outputs.build-cache-key }}
    - name: Verify the actual rendered colour blend
      if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' }}
      run: |
        if [ "${{ inputs.scope }}" = "animation-only" ]; then
          echo "Animation-only run: UI gesture tests are intentionally not selected."
          xcrun simctl boot "$UI_SIMULATOR_ID"
          xcrun simctl bootstatus "$UI_SIMULATOR_ID" -b > build/unit-boot.log 2>&1
        fi
        if ! xcodebuild test-without-building -project Erhu.xcodeproj -scheme Erhu -configuration Debug \
          -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
          -destination "id=$UI_SIMULATOR_ID" -resultBundlePath build/BlendResults.xcresult \
          CODE_SIGNING_ALLOWED=NO -only-testing:ErhuTests/PlayerRenderingTests \
          -only-testing:ErhuTests/CarouselMotionTests \
          -parallel-testing-enabled NO > build/blend-tests.log 2>&1; then
          python3 Tools/report_native_interactions.py build/blend-tests.log
          tail -n 35 build/blend-tests.log
          exit 1
        fi
    - name: Upload test results and performance measurements
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: amp-cover-interaction-results
        path: |-
          build/InteractionResults.xcresult
          build/InteractionResults-attempt-1.xcresult
          build/BlendResults.xcresult
          build/ui-tests.log
          build/ui-tests-attempt-1.log
          build/ui-boot*.log
          build/unit-boot.log
          build/blend-tests.log
          build/simulator-build.log
          build/render-build.log
        if-no-files-found: warn
    - name: Shut down simulators
      if: always()
      run: |
        xcrun simctl shutdown "$UI_SIMULATOR_ID" >/dev/null 2>&1 || true
