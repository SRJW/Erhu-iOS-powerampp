name: iOS
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.artifact_run && (github.ref == 'refs/heads/without-animated-art' || github.event_name == 'workflow_dispatch') && github.event.deleted != true }}
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
    - uses: actions/checkout@v5
    - name: Reserve the release tag at the source revision
      env:
        RELEASE_TAG: v0.1.0-amp.${{ github.run_number }}
      run: |
        set -euo pipefail
        if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG")" = "$GITHUB_SHA"
        else
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
        fi
    - uses: ./.github/actions/setup-ios
      id: setup
      with:
        cache-suffix: device-release
    - name: Test real file deletion boundaries
      run: |
        xcrun swiftc Erhu/Core/Model/LibraryFileDeletion.swift Tools/Tests/LibraryFileDeletion/main.swift -o "$RUNNER_TEMP/amp-file-deletion-tests"
        "$RUNNER_TEMP/amp-file-deletion-tests"
    - name: Test scrolling waveform interactions
      run: |
        xcrun swiftc Erhu/Core/Playback/ScrollingWaveform.swift Tools/Tests/ScrollingWaveform/main.swift -o "$RUNNER_TEMP/amp-waveform-tests"
        "$RUNNER_TEMP/amp-waveform-tests"
    - name: Test widget storage and playback launches
      run: |
        xcrun swiftc WidgetShared/PlayerWidgetStorage.swift WidgetShared/PlayerWidgetSnapshot.swift WidgetShared/PlayerLaunchRequest.swift Tools/Tests/PlayerWidget/main.swift -o "$RUNNER_TEMP/amp-widget-tests"
        "$RUNNER_TEMP/amp-widget-tests"
    - name: Test cover transitions and rapid track changes
      run: |
        xcrun swiftc Erhu/Core/Playback/ArtworkSlide.swift Tools/Tests/ArtworkSlide/main.swift -o "$RUNNER_TEMP/amp-artwork-tests"
        "$RUNNER_TEMP/amp-artwork-tests"
    - name: Test temporary audio sharing and cleanup
      run: |
        xcrun swiftc Erhu/Core/Common/PreparedAudioShare.swift Tools/Tests/AudioShare/main.swift -o "$RUNNER_TEMP/amp-share-tests"
        "$RUNNER_TEMP/amp-share-tests"
    - name: Test release detection against GitHub
      run: |
        xcrun swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Erhu/Core/Common/HTTPClient.swift Erhu/Core/Settings/ReleaseChecker.swift Tools/Tests/ReleaseChecker/main.swift -o "$RUNNER_TEMP/amp-release-tests"
        "$RUNNER_TEMP/amp-release-tests"
    - name: Build unsigned app
      run: |
        set -o pipefail
        mkdir -p build
        if ! xcodebuild build -project Erhu.xcodeproj -scheme Erhu -configuration Release \
          -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages \
          ERHU_RELEASE_TAG="v0.1.0-amp.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
          SWIFT_ACTIVE_COMPILATION_CONDITIONS=ERHU_STATIC_ART \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build/compile.log 2>&1; then
          python3 - <<'PY'
        import os
        from pathlib import Path
        lines = Path('build/compile.log').read_text(errors='replace').splitlines()
        errors = [line for line in lines if 'error:' in line.lower()]
        for error in errors[:12]:
            escaped = error.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
            print('::error::' + escaped, flush=True)
        detail = '\n'.join(errors or lines[-80:])[-24000:]
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('## Build errors\n\n```text\n' + detail + '\n```\n')
        PY
          exit 1
        fi
    - name: Package static IPA
      run: |
        mkdir -p dist/Payload
        cp -R build/DerivedData/Build/Products/Release-iphoneos/Erhu.app dist/Payload/
        test -d dist/Payload/Erhu.app/PlugIns/ErhuPlayerWidget.appex
        test -d dist/Payload/Erhu.app/Metadata.appintents
        test -d dist/Payload/Erhu.app/PlugIns/ErhuPlayerWidget.appex/Metadata.appintents
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' dist/Payload/Erhu.app/Info.plist)" = "amp"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' dist/Payload/Erhu.app/PlugIns/ErhuPlayerWidget.appex/Info.plist)" = "amp Player"
        # Carry the requested App Groups in both executables so a re-signer can
        # preserve/remap them. Ad-hoc signatures do not grant device permissions.
        app=dist/Payload/Erhu.app
        while IFS= read -r -d '' framework; do
          codesign --force --sign - "$framework"
        done < <(find "$app" -depth -type d -name '*.framework' -print0)
        codesign --force --sign - --generate-entitlement-der \
          --entitlements Support/ErhuPlayerWidget.entitlements "$app/PlugIns/ErhuPlayerWidget.appex"
        codesign --force --sign - --generate-entitlement-der \
          --entitlements Support/Erhu.entitlements "$app"
        codesign --verify --deep --strict "$app"
        python3 - <<'PYVERIFY'
        import plistlib
        import subprocess
        from pathlib import Path
        app = Path('dist/Payload/Erhu.app')
        for bundle, declared in [(app, 'Support/Erhu.entitlements'),
                                 (app / 'PlugIns/ErhuPlayerWidget.appex', 'Support/ErhuPlayerWidget.entitlements')]:
            result = subprocess.run(['codesign', '--display', '--xml', '--entitlements', '-', str(bundle)],
                                    check=True, capture_output=True)
            actual = plistlib.loads(result.stdout)
            expected = plistlib.loads(Path(declared).read_bytes())
            key = 'com.apple.security.application-groups'
            if actual.get(key) != expected[key]:
                raise SystemExit(f'App Group request missing from {bundle.name}')
            print(f'{bundle.name}: verified embedded App Group request {actual[key]}')
        PYVERIFY
        (cd dist && zip -qry amp.ipa Payload)
        python3 Tools/report_app_size.py dist/Payload/Erhu.app dist/amp.ipa
        printf 'Static artwork development IPA. Full simulator tests are a separate manual workflow.\n' >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: amp-ipa
        path: dist/amp.ipa
        compression-level: 0
        if-no-files-found: error
    - name: Save compiled products and module caches
      if: steps.setup.outputs.build-cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          build/DerivedData/Build
          build/DerivedData/ModuleCache.noindex
          build/DerivedData/SDKStatCaches.noindex
          build/source-file-stamps.json
        key: ${{ steps.setup.outputs.build-cache-key }}
    - name: Upload device build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Erhu-build-logs
        path: |
          build/compile.log
          build/resolve.log
        if-no-files-found: warn
  cover-checks:
    if: ${{ !inputs.artifact_run && github.ref == 'refs/heads/without-animated-art' && github.event.deleted != true }}
    uses: ./.github/workflows/player-interaction.yml
    permissions:
      contents: read
  publish:
    # Development IPA publication depends on the device build. Simulator checks
    # report independently and must not hold a completed IPA until timeout.
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run != '')) }}
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v5
    - name: Resolve original IPA build
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_RUN_ID: ${{ inputs.artifact_run || github.run_id }}
        REUSE_ARTIFACT: ${{ inputs.artifact_run != '' }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
        gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
        python3 - <<'PYRESOLVE'
        import json, os, re
        source = json.load(open('source-run.json'))
        assert source['repository']['full_name'] == os.environ['GH_REPO']
        assert source['path'] == '.github/workflows/ios.yml'
        assert re.fullmatch('[0-9a-f]{40}', source['head_sha'])
        if os.environ['REUSE_ARTIFACT'] == 'true':
            assert source['conclusion'] == 'success', 'Only successful device builds can be published'
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('IPA_SOURCE_RUN=' + str(source['id']) + '\n')
            output.write('IPA_BUILD_NUMBER=' + str(source['run_number']) + '\n')
            output.write('IPA_SOURCE_SHA=' + source['head_sha'] + '\n')
        PYRESOLVE
    - uses: actions/download-artifact@v4
      with:
        name: amp-ipa
        path: dist
        run-id: ${{ env.IPA_SOURCE_RUN }}
        github-token: ${{ github.token }}
    - name: Publish a direct IPA download
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NATIVE_CHECKS_RESULT: separate-workflow
      run: bash Tools/publish_ipa.sh dist/amp.ipa
'on':
  push:
    branches:
    - without-animated-art
    paths:
    - Erhu/**
    - ErhuPlayerWidget/**
    - WidgetShared/**
    - Support/**
    - project.yml
    - .github/workflows/ios.yml
    - .github/actions/setup-ios/**
    - Tools/report_app_size.py
    - Tools/publish_ipa.sh
    - Tools/restore_source_timestamps.py
    - Tools/Tests/LibraryFileDeletion/**
    - Tools/Tests/ScrollingWaveform/**
    - Tools/Tests/PlayerWidget/**
    - Tools/Tests/ArtworkSlide/**
    - ErhuInteractionTests/**
    - ErhuTests/Playback/PlayerRenderingTests.swift
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Successful iOS run ID to publish without rebuilding (empty creates a new IPA)
        type: string
        default: ''
      runner:
        description: macos-15 is Apple Silicon; choose it when ARM capacity is available.
        type: choice
        default: macos-15-intel
        options:
        - macos-15-intel
        - macos-15
